# Fast path: build, typecheck, test and pack @agent-relay/sandbox on Blacksmith
# runners, outside the shared GitHub-hosted queue. Anyone with write access
# (people or agents) may start it; nothing runs until Khaliq approves the
# fast-path environment.
#
# It does not publish to npm: the package uses npm trusted publishing (OIDC)
# bound to publish.yml, so this workflow cannot authenticate to the registry.
# Instead it uploads the `npm pack` tarball as a workflow artifact named
# sandbox-npm-<sha>. It never moves any npm dist-tag or git tag.
name: fast-path
run-name: fast-path ${{ inputs.ref }} (${{ inputs.reason }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (a PR branch is fine)
        required: true
        default: main
      reason:
        description: Why this needs the fast path
        required: true
permissions:
  contents: read
concurrency:
  group: fast-path-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  test:
    environment: fast-path
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Packed package smoke test
        run: npm run test:package
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
  pack:
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        id: pack
        run: |
          mkdir -p dist-pack
          file=$(npm pack --ignore-scripts --pack-destination dist-pack | tail -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-npm-${{ needs.test.outputs.sha }}
          path: dist-pack/*.tgz
          if-no-files-found: error
      - name: Summary
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.test.outputs.sha }}
          REASON: ${{ inputs.reason }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          {
            echo "### sandbox fast path"
            echo "- ref: \`$REF\` at \`$SHA\`"
            echo "- reason: $REASON"
            echo "- npm tarball: \`$FILE\` in artifact \`sandbox-npm-$SHA\` (not published: npm trusted publishing is bound to publish.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
