name: Publish

# Manual-dispatch only. Nothing here publishes on push or on merge.
#
# Authentication is npm OIDC trusted publishing — tokenless. There is no
# NPM_TOKEN and no NODE_AUTH_TOKEN: the `id-token: write` permission below lets
# the runner exchange a short-lived GitHub OIDC token with the registry.
#
# A real publish therefore requires the repository owner to configure this repo
# and this workflow path as a "trusted publisher" for the package on npmjs.org.
# That configuration is the OIDC equivalent of granting a token, and it is the
# owner's step. Until it exists, a non-dry-run publish fails at the registry.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version already prepared in package.json"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: false
        type: choice
        options:
          - latest
          - next
          - beta
        default: "latest"
      dry_run:
        description: "Dry run (pack and validate, do not publish)"
        required: false
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1. Pinned to the 11 line
      # rather than @latest on purpose: npm 12 requires Node >= 22.22.2, which
      # would break against the Node 22 pinned above.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@11

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./package.json').version")
          LOCKFILE_VERSION=$(node -p "require('./package-lock.json').version")
          LOCKFILE_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$REQUESTED_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error title=Version mismatch::requested version ($REQUESTED_VERSION) must match package.json ($MANIFEST_VERSION)"
            exit 1
          fi
          if [ "$LOCKFILE_VERSION" != "$MANIFEST_VERSION" ] || [ "$LOCKFILE_ROOT_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error title=Version mismatch::package-lock.json ($LOCKFILE_VERSION, root $LOCKFILE_ROOT_VERSION) must match package.json ($MANIFEST_VERSION)"
            exit 1
          fi
          npm version "$REQUESTED_VERSION" --no-git-tag-version --allow-same-version
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "::error title=Unexpected version mutation::version validation changed a manifest"
            exit 1
          fi
          echo "new_version=${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${NEW_VERSION}" > /dev/null 2>&1; then
            echo "::error title=Release tag exists::v${NEW_VERSION} already exists on origin"
            exit 1
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then
              echo "::error title=Tag check failed::could not verify whether v${NEW_VERSION} exists on origin"
              exit "$STATUS"
            fi
          fi

      - name: Dry run publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run --access public --tag ${{ github.event.inputs.tag }} --ignore-scripts

      - name: Publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance --tag ${{ github.event.inputs.tag }} --ignore-scripts

      - name: Tag release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
